<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zahra Khazaei | Fachinformatikerin Systemintegration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f8f9fa;
  --white:#ffffff;
  --text:#222222;
  --gray:#6b7280;
  --border:#e5e7eb;
  --dark:#2f3437;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

header{
  background:var(--white);
  border-bottom:1px solid var(--border);
}

.hero{
  min-height:85vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
  flex-wrap:wrap;
}

.hero-text{
  flex:1;
  min-width:300px;
}

.hero-text h1{
  font-size:3rem;
  margin-bottom:10px;
}

.hero-text h2{
  font-size:1.2rem;
  color:var(--gray);
  font-weight:400;
}

.hero-text p{
  margin:25px 0;
  color:var(--gray);
}

.hero-image{
  flex:1;
  text-align:center;
}

.hero-image img{
  width:320px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
